services:

  # documentation (basic usage): ofhttps://hub.docker.com/_/caddy
  caddy:
    build: 
      context: .
      dockerfile: ./caddy/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data # https://caddyserver.com/docs/conventions#data-directory
      - caddy_config:/config # https://caddyserver.com/docs/conventions#configuration-directory
    networks:
      - web
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    # ports: # not exposed when caddy is used
    #   - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/examToolboxDB
    depends_on:
      - mongo
    networks:
      - web

  # not needed when caddy hosts static frontend build files
  # frontend:
  #   build:
  #     context: ./frontend
  #   ports:
  #     - "4200:80"
  #   networks:
  #     - web

  mongo:
    image: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - web

volumes:
  mongodb_data: 
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge