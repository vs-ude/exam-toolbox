services:
  # documentation (basic usage): ofhttps://hub.docker.com/_/caddy
  # auto-generates crypto key (https://docs.authcrunch.com/docs/authenticate/auth-cookie)
  # also possible to set a key manually, for better persistance (and possible other advantages). Not needed here for now.
  caddy:
    build:
      context: .
      dockerfile: ./caddy/Dockerfile
    command: [
        "caddy",
        "run",
        "--config",
        "/etc/caddy/Caddyfile",
        "--adapter",
        "caddyfile",
        "--watch",
      ] # Watch only for debugging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/conf/:/etc/caddy/
      - caddy_data:/data # https://caddyserver.com/docs/conventions#data-directory
      - caddy_config:/config # https://caddyserver.com/docs/conventions#configuration-directory
    networks:
      - web
    depends_on:
      - backend
    environment:
      - LDAP_BIND_PASSWORD=readonly
      - CADDY_DOMAIN=localhost # needs to be changed for production (with domain)
      - JWT_SHARED_KEY=1999fcc6-5499-4524-9b93-f4ad2dd46e5e

  backend:
    build:
      context: ./backend
    # ports: # not exposed when caddy is used
    #   - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - MONGODB_URI=mongodb://mongo:27017/examToolboxDB
    depends_on:
      - mongo
    networks:
      - web

  # not needed when caddy hosts static frontend build files
  # frontend:
  #   build:
  #     context: ./frontend
  #   ports:
  #     - "4200:80"
  #   networks:
  #     - web

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - web

  ldap-host:
    image: osixia/openldap:1.5.0
    command: --copy-service # --loglevel debug # Do not overwrite custom ldif files
    restart: unless-stopped
    networks:
      web:
    environment:
      - LDAP_ORGANISATION="Exascan" # Login: cn=admin,dc=exascan,dc=com
      - LDAP_DOMAIN=exascan.com
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_SECRET} # ldap-host needs the pw to create the admin-account.
      - LDAP_READONLY_USER=True # username: "readonly", pw: "readonly"
    volumes:
      # needed to make users persistant, else everytime the docker-container is rebuild (docker-compose down && docker-compose up) all users would be deleted. Also makes the configurations persistant.
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap/:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro

  ldap-admin:
    image: osixia/phpldapadmin:0.9.0
    restart: unless-stopped
    networks:
      web:
    ports:
      - "6080:80"
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=ldap-host
      - PHPLDAPADMIN_HTTPS=false
    depends_on:
      - ldap-host

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:
  ldap_data:
  ldap_config:

networks:
  web:
    driver: bridge
