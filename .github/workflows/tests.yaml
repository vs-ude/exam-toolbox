name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-integration:
    runs-on: ubuntu-26.04

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ghostscript imagemagick qrencode zbar-tools zip

      # - name: Run linter
      #   run: deno lint

      - name: Run tests
        run: deno task test:integration
        working-directory: backend
