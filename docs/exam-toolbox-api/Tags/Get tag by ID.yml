info:
  name: Get tag by ID
  type: http
  seq: 4
  tags:
    - Tags

http:
  method: GET
  url: "{{baseUrl}}/api/tags/:id"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Tag document
    request:
      url: "{{baseUrl}}/api/tags/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "_id": "",
            "name": "",
            "color": "",
            "textColor": ""
          }
  - name: 404 Response
    description: Not found
    request:
      url: "{{baseUrl}}/api/tags/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
