info:
  name: List users and groups
  type: http
  seq: 3
  tags:
    - Auth

http:
  method: GET
  url: "{{baseUrl}}/api/auth/entities"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Users and groups
    request:
      url: "{{baseUrl}}/api/auth/entities"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "uids": [],
            "groups": [
              {
                "name": "",
                "rights": "admin"
              }
            ]
          }

docs: Synchronises LDAP users to the database and returns all user UIDs and configured groups.
