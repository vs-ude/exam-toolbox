info:
  name: Recent exams
  type: http
  seq: 4
  tags:
    - Exams

http:
  method: GET
  url: "{{baseUrl}}/api/exams/recent"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Recent exams
    request:
      url: "{{baseUrl}}/api/exams/recent"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "_id": "",
              "courseName": "",
              "examinerName": "",
              "semester": "",
              "date": "",
              "examLengthMinutes": 0,
              "points": 0,
              "pageCount": 0,
              "conceptPages": 0,
              "lastEditedBy": "",
              "updatedAt": ""
            }
          ]

docs: Returns the 8 most recently edited exams for the authenticated user.
