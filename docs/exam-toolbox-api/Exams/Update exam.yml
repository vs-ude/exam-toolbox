info:
  name: Update exam
  type: http
  seq: 7
  tags:
    - Exams

http:
  method: PUT
  url: "{{baseUrl}}/api/exams/:examId"
  body:
    type: json
    data: "{}"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Updated
    request:
      url: "{{baseUrl}}/api/exams/:examId"
      method: PUT
      body:
        type: json
        data: "{}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "",
            "insertedId": ""
          }
  - name: 400 Response
    description: Missing fields
    request:
      url: "{{baseUrl}}/api/exams/:examId"
      method: PUT
      body:
        type: json
        data: "{}"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
  - name: 404 Response
    description: Not found
    request:
      url: "{{baseUrl}}/api/exams/:examId"
      method: PUT
      body:
        type: json
        data: "{}"
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }

docs: Replaces the exam document identified by `examId` with `updatedExam`.
