info:
  name: Generate exam preview
  type: http
  seq: 9
  tags:
    - Exams

http:
  method: POST
  url: "{{baseUrl}}/api/exam/preview"
  body:
    type: json
    data: "{}"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/exam/preview"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/pdf
      body:
        type: text
        data: ""
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/exam/preview"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }

docs: Generates a preview PDF from the given Exam JSON object.
