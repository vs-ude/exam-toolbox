info:
  name: Sync LDAP users
  type: http
  seq: 2
  tags:
    - Admin

http:
  method: POST
  url: "{{baseUrl}}/api/admin/syncUsers"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: LDAP users synced successfully
    request:
      url: "{{baseUrl}}/api/admin/syncUsers"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 403 Response
    description: Not authorised (not an admin)
    request:
      url: "{{baseUrl}}/api/admin/syncUsers"
      method: POST
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }

docs: Syncs LDAP users with the local database. Restricted to users in the admin group.
