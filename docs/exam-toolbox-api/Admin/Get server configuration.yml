info:
  name: Get server configuration
  type: http
  seq: 1
  tags:
    - Admin

http:
  method: GET
  url: "{{baseUrl}}/api/admin/config"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Current server configuration
    request:
      url: "{{baseUrl}}/api/admin/config"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 401 Response
    description: Not authorised (not an admin)
    request:
      url: "{{baseUrl}}/api/admin/config"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }

docs: Returns the current runtime configuration. Restricted to users in the admin group.
