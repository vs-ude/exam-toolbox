info:
  name: Delete exam
  type: http
  seq: 5
  tags:
    - Admin

http:
  method: DELETE
  url: "{{baseUrl}}/api/admin/exams/:examId"
  params:
    - name: examId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Deleted
    request:
      url: "{{baseUrl}}/api/admin/exams/:examId"
      method: DELETE
      params:
        - name: examId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
  - name: 403 Response
    description: Not authorised (not an admin)
    request:
      url: "{{baseUrl}}/api/admin/exams/:examId"
      method: DELETE
      params:
        - name: examId
          value: ""
          type: path
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
  - name: 404 Response
    description: Not found
    request:
      url: "{{baseUrl}}/api/admin/exams/:examId"
      method: DELETE
      params:
        - name: examId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }

docs: Deletes any exam by ID, without access filtering. Restricted to users in the admin group.
