info:
  name: Cancel job
  type: http
  seq: 3
  tags:
    - Jobs

http:
  method: DELETE
  url: "{{baseUrl}}/api/jobs/:jobId"
  params:
    - name: jobId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Cancelled
    request:
      url: "{{baseUrl}}/api/jobs/:jobId"
      method: DELETE
      params:
        - name: jobId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
  - name: 400 Response
    description: Job cannot be cancelled
    request:
      url: "{{baseUrl}}/api/jobs/:jobId"
      method: DELETE
      params:
        - name: jobId
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
  - name: 404 Response
    description: Job not found
    request:
      url: "{{baseUrl}}/api/jobs/:jobId"
      method: DELETE
      params:
        - name: jobId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }

docs: Cancels a queued or in-progress generation job and cleans up its working directory.
