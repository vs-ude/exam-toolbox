info:
  name: Get active job for exam
  type: http
  seq: 4
  tags:
    - Jobs

http:
  method: GET
  url: "{{baseUrl}}/api/exams/:examId/active-job"
  params:
    - name: examId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Active job or null
    request:
      url: "{{baseUrl}}/api/exams/:examId/active-job"
      method: GET
      params:
        - name: examId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""

docs: Returns the active (queued/processing/finalizing) generation job for the given exam, or null.
