stages:
  - test

image: docker:25.0.5

variables:
  DOCKER_TLS_CERTDIR: ''

style:
  image: alpine:latest
  stage: test
  variables:
    APK_CACHE_DIR: $CI_PROJECT_DIR/.cache/apk
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - $APK_CACHE_DIR
  before_script:
    - mkdir -p $APK_CACHE_DIR
    - apk add --cache-dir $APK_CACHE_DIR prettier >/dev/null 2>&1
  script:
    - prettier --check **/*.ts **/*.scss **/*.html

backend_tests:
  image: denoland/deno:latest
  stage: test
  variables:
    DENO_DIR: $CI_PROJECT_DIR/.deno_cache
  cache:
    - key:
        files:
          - backend/deno.lock
      paths:
        - .deno_cache/
    - key:
        files:
          - .ci/backend_integration_packages.txt
      paths:
        - .apt-cache/lists/
        - .apt-cache/archives/
  before_script:
    - bash .ci/prepare_backend_integration.sh .ci/backend_integration_packages.txt
    - cd backend
    - deno install -q
  script:
    - deno check
    - deno run cover
  coverage: '/All files[^|]*|[^|]*\s+([\d\.]+)/'

# Cypress Tests
cypress_e2e:
  stage: test
  image:
    name: cypress/included:15.18.1
    entrypoint: ['']
  services:
    - name: osixia/openldap:1.5.0
      alias: ldap-host
      variables:
        LDAP_ORGANISATION: 'University'
        LDAP_DOMAIN: university.example
        LDAP_BASE_DN: dc=university,dc=example
        LDAP_READONLY_USER: 'True' # username: "readonly", pw: "readonly"
    - name: mongo:6.0
      alias: mongo
    - name: marlonb/mailcrab:latest
      alias: mailcrab
  variables:
    DB_CONNSTRING: mongodb://mongo:27017/examToolboxDB
    AUTH_LDAP_URL: 'ldap://ldap-host:389'
    AUTH_LDAP_BIND_DN: 'cn=readonly,dc=university,dc=example'
    AUTH_LDAP_BIND_PASSWORD: 'readonly'
    AUTH_LDAP_USER_SEARCH_BASE: 'ou=users,ou=accounts,dc=university,dc=example'
    AUTH_LDAP_GROUP_DN_BASE: 'cn=%s,ou=groups,ou=accounts,dc=university,dc=example'
    AUTH_LDAP_GROUPS_REQUIRED: 'toolboxUsers'
    AUTH_LDAP_GROUPS_ADMIN: 'admins'
    AUTH_LDAP_GROUPS_FULL: 'teachers'
    AUTH_JWT_SECRET: 'ad06569335976252a1cea6ee4521f0c33e2fa93507e228a053dc8b75f3418312'
    SMTP_HOST: mailcrab
    SMTP_PORT: 1025
    SMTP_FROM: noreply@example.com
    SERVER_PUBLIC_URL: 'http://localhost'
    PATHS_TEMPLATE_BASE_PATH: '${CI_PROJECT_DIR}/backend/template'
    PATHS_CACHE_DIR: /tmp/cache
    PATHS_JOBS_DIR: /tmp/jobs
    DENO_DIR: $CI_PROJECT_DIR/.deno_cache
  cache:
    - key:
        files:
          - backend/deno.lock
          - frontend/deno.lock
      paths:
        - .deno_cache/
    - key: exam-toolbox-e2e-cache
      paths:
        - .npm_cache/
    - key:
        files:
          - .ci/backend_integration_packages.txt
          - .ci/e2e/packages.txt
      paths:
        - .apt-cache/lists/
        - .apt-cache/archives/
  before_script:
    - bash .ci/prepare_backend_integration.sh .ci/backend_integration_packages.txt
    - bash .ci/prepare_backend_integration.sh .ci/e2e/packages.txt
    - npm config set cache ${CI_PROJECT_DIR}/.npm_cache && npm i --allow-scripts deno -g deno >/dev/null
    - bash -c 'cd backend && deno install -q'
    - bash -c 'cd frontend && deno install -q'
    - mkdir -p /tmp/cache /tmp/jobs /tmp/uploads # For caddy
    - ldapadd -f ldap/10-testuser.ldif -D cn=admin,dc=university,dc=example -w admin -H ldap://ldap-host:389 > /dev/null
  script:
    - bash .ci/e2e/start.sh
    - cypress run --config-file cypress/cypress.config.ts --quiet
  # after_script:
  #   - bash .ci/e2e/print_logs_on_fail.sh
  artifacts:
    when: always
    paths:
      - .logs/*.log
      - cypress/screenshots/**/*.png
    expire_in: 1 day
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
      when: always
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
      when: always
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: true
