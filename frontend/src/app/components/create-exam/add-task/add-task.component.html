<div class="task_container" (mouseover)="hovered=true" (mouseleave)="hovered=false"
    [ngStyle]="{'backgroundColor': hovered ? color : 'var(--color-bg-lifted)' }">
    <div class="task_icon" [ngStyle]="{'backgroundColor': hovered ? '#0000002a' : color }" >
        <img src="{{ iconName }}">
    </div>
    <div class="task_name" [ngStyle]="{'color': hovered ? '#fff' : '' }" ><span> {{ name }} </span></div>
</div>
