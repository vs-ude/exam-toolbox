<app-task-header
  [bilingual]="bilingual"
  [task]="task"
  (questionChange)="onQuestionChange($event)"
></app-task-header>

<div class="form-body">
  <div class="solution-header header-row">Short Answer</div>
  @if (bilingual) {
    <app-latex-textarea
      label="Lösung (DE)"
      [value]="task.solution.DE"
      (valueChange)="updateSolution($event, 'DE')"
      (blur)="updateTask()"
    ></app-latex-textarea>

    <app-latex-textarea
      label="Solution (EN)"
      [value]="task.solution.EN"
      (valueChange)="updateSolution($event, 'EN')"
      (blur)="updateTask()"
    ></app-latex-textarea>
  } @else {
    <app-latex-textarea
      label="Solution"
      [value]="task.solution.DE"
      (valueChange)="updateSolution($event, 'DE')"
      (blur)="updateTask()"
    ></app-latex-textarea>
  }
</div>

<app-task-footer
  [task]="task"
  [isModifiedPoolTask]="isModifiedPoolTask"
  (deleteEvent)="onDelete()"
  (createNewTaskEvent)="onCreateNewTaskChange($event)"
  (newTagEvent)="onAddTag()"
  (previewEvent)="onPreview()"
  (taskChangeEvent)="updateTask()"
>
</app-task-footer>
