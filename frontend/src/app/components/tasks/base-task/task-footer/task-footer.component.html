<!-- Footer -->
<div class="form-footer">
  <div class="footer-actions">
    <div class="icon_wrapper footer_icon_delete">
      <mat-icon aria-hidden="false" matTooltip="Delete" (click)="onDelete()"
        >delete</mat-icon
      >
    </div>

    @for (tag of task.tags; track tag) {
      <div
        class="tag"
        [ngStyle]="{ 'background-color': tag.color, color: tag.textColor }"
      >
        {{ tag.name }}
      </div>
    }

    <div class="icon_wrapper footer_icon">
      <mat-icon aria-hidden="false" matTooltip="Add Tag" (click)="onAddTag()"
        >add</mat-icon
      >
    </div>

    @if (!hasNoPreview) {
      <div class="icon_wrapper footer_icon">
        <mat-icon
          aria-hidden="false"
          matTooltip="Goto Preview"
          (click)="onPreview()"
          >preview</mat-icon
        >
      </div>
    }

    @if (isModifiedPoolTask) {
      <div class="newTaskCheckbox_container">
        <mat-checkbox
          name="newTaskCheckbox"
          [checked]="createNewTask"
          (change)="onCreateNewTaskChange($event.checked)"
        >
          New Task
        </mat-checkbox>
      </div>
    }
  </div>

  @if (!hasNoPoints) {
    <mat-form-field class="points" [matTooltip]="pointsPerLineLabel">
      <mat-label>Points</mat-label>
      <input
        matInput
        type="number"
        step="0.5"
        min="0.5"
        value="1"
        [(ngModel)]="this.points"
        (change)="onPointsChange()"
      />
    </mat-form-field>
  }
</div>
