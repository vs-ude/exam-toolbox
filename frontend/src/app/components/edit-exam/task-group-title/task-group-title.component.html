<!-- Bilingual -->
<div class="title">Assignment {{ assignmentNumber }}</div>
<div class="question-container">
  @if (bilingual) {
    <app-latex-textarea
      label="Titel"
      [value]="description.DE"
      (valueChange)="updateTitle($event, 'DE')"
    ></app-latex-textarea>

    <app-latex-textarea
      label="Title"
      [value]="description.EN"
      (valueChange)="updateTitle($event, 'EN')"
    ></app-latex-textarea>
  } @else {
    <app-latex-textarea
      label="Title"
      [value]="description.DE"
      (valueChange)="updateTitle($event, 'DE')"
    ></app-latex-textarea>
  }
