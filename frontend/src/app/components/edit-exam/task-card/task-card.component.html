<mat-card
  class="form-card"
  [ngClass]="{ error: !!errorMessage }"
  [matTooltip]="errorMessage ?? ''"
  cdkDrag
>
  <div class="card-layout">
    <div class="left">
      @if (effectiveSubtaskId) {
        <div class="subtask-id">{{ effectiveSubtaskId }}</div>
      }
      <div class="drag_handle" cdkDragHandle>
        <mat-icon>drag_indicator</mat-icon>
      </div>
    </div>
    <div class="card-content">
      <ng-container #host></ng-container>
    </div>
  </div>
</mat-card>
