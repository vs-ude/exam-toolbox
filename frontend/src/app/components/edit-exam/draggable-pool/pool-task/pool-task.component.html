<div
  class="task_container"
  cdkDrag
  [cdkDragData]="dragData"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (cdkDragStarted)="onDragStarted()"
  [style.backgroundColor]="hovered ? color : 'var(--color-bg-lifted)'"
>
  <div
    class="task_icon"
    [style.backgroundColor]="hovered ? '#0000002a' : color"
  >
    <img [src]="publicPath + iconName" />
  </div>
  <div class="task_name" [style.color]="hovered ? '#fff' : ''">
    <span> {{ task.question.DE }} </span>
  </div>
  <div class="task-points" [style.color]="hovered ? '#fff' : ''">
    <span> {{ task.points }} Pts. </span>
  </div>

  <!-- tooltip is created dynamically and appended to document.body -->
</div>
